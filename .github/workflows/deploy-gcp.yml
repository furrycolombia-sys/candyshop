# GCP production deploy — primary deploy workflow.
# Triggers automatically on push to main, or manually via workflow_dispatch.
# Can also be called as a reusable workflow (workflow_call); in that mode
# the build job is skipped (caller already built and uploaded artifacts).
# Last reviewed: v2026.05.10.4 — deploy step ~3m, warm-up non-blocking.
#
# Manual usage: Actions tab → "Deploy GCP Production" → Run workflow.

name: Deploy GCP Production

on:
  push:
    branches:
      - main
  workflow_call: {}
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # ============================================
  # Build — only runs in standalone mode.
  # In workflow_call mode the orchestrator already
  # built and uploaded artifacts to the shared run.
  # ============================================
  build:
    name: Build (Standalone Production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_call'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/*/.next/cache
          key: ${{ runner.os }}-nextjs-prod-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-prod-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-prod-

      - name: Compute app version
        id: app_version
        run: |
          VERSION=$(git log -1 --pretty=%s | grep -oP 'v\d{4}\.\d{2}\.\d{2}\.\d+' || true)
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_SHA:0:7}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Build all apps (standalone, production)
        run: pnpm run build
        env:
          CI: "true"
          TARGET_ENV: prod
          STANDALONE: "true"
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          TALLY_FORM_ID: ${{ secrets.TALLY_FORM_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
          SUPABASE_AUTH_EXTERNAL_DISCORD_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_DISCORD_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_DISCORD_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_DISCORD_SECRET }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.app_version.outputs.value }}

      - name: Ensure artifact directories are non-empty
        run: |
          for app in store admin auth landing payments studio playground; do
            mkdir -p "apps/$app/.next/static"
            touch "apps/$app/.next/static/.artifact-placeholder"
            mkdir -p "apps/$app/public"
            touch "apps/$app/public/.artifact-placeholder"
          done

      - name: Upload store build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-store
          path: apps/store/.next/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload admin build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-admin
          path: apps/admin/.next/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload auth build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-auth
          path: apps/auth/.next/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload landing build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-landing
          path: apps/landing/.next/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload payments build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-payments
          path: apps/payments/.next/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload studio build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-studio
          path: apps/studio/.next/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload playground build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-playground
          path: apps/playground/.next/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  # ============================================
  # Build the Docker image in CI (7 GB RAM) and push to GHCR.
  # The e2-micro VM (1 GB RAM) OOMs during "exporting layers" when building
  # locally, so we build here and let the VM do a cheap docker pull instead.
  # ============================================
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      image_latest: ${{ steps.image.outputs.latest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download store build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-store
          path: apps/store/.next/

      - name: Download admin build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-admin
          path: apps/admin/.next/

      - name: Download auth build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-auth
          path: apps/auth/.next/

      - name: Download landing build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-landing
          path: apps/landing/.next/

      - name: Download payments build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-payments
          path: apps/payments/.next/

      - name: Download studio build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-studio
          path: apps/studio/.next/

      - name: Download playground build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-playground
          path: apps/playground/.next/

      - name: Ensure artifact directories exist
        run: |
          for app in store admin auth landing payments studio playground; do
            mkdir -p "apps/$app/.next/static" "apps/$app/public"
          done

      - name: Set image name
        id: image
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER_LC}/candyshop-prod:${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${OWNER_LC}/candyshop-prod:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          LATEST="${{ steps.image.outputs.latest }}"
          docker pull "$LATEST" 2>/dev/null || true
          docker build \
            -f docker/prod/Dockerfile \
            -t "$IMAGE" \
            --cache-from "$LATEST" \
            .
          docker push "$IMAGE"
          docker tag "$IMAGE" "$LATEST"
          docker push "$LATEST"

  # ============================================
  # Deploy to GCP production VM via direct SSH
  # No cloudflared — connects directly to 35.238.125.109
  # ============================================
  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, docker-build-push]
    # Run when build succeeded (dispatch mode) or was skipped (workflow_call mode),
    # and the Docker image was successfully pushed to GHCR.
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs['docker-build-push'].result == 'success' }}
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup SSH key
        run: |
          # Strip BOM and whitespace from all GCP secrets before use
          GCP_HOST=$(echo "${{ secrets.GCP_PROD_SERVER_HOST }}" | python3 -c "import sys; print(sys.stdin.buffer.read().decode('utf-8-sig').strip())")
          GCP_USER=$(echo "${{ secrets.GCP_PROD_SERVER_USER }}" | python3 -c "import sys; print(sys.stdin.buffer.read().decode('utf-8-sig').strip())")
          echo "GCP_HOST=$GCP_HOST" >> "$GITHUB_ENV"
          echo "GCP_USER=$GCP_USER" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          # Strip BOM and carriage returns from SSH private key
          echo "${{ secrets.GCP_PROD_SERVER_SSH_KEY }}" | python3 -c "import sys; data=sys.stdin.buffer.read().decode('utf-8-sig'); sys.stdout.write(data.replace('\r',''))" > ~/.ssh/gcp_deploy_key
          chmod 600 ~/.ssh/gcp_deploy_key
          cat >> ~/.ssh/config << EOF
          Host $GCP_HOST
            HostName $GCP_HOST
            User $GCP_USER
            IdentityFile ~/.ssh/gcp_deploy_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
            ServerAliveInterval 30
            ServerAliveCountMax 20
            GSSAPIAuthentication no
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 600
          EOF

      - name: Open SSH master connection
        run: |
          # Establish one persistent TCP connection; all later SSH calls reuse it.
          # Retry up to 5 times — VM sshd can be slow after a prior session.
          connected=0
          for attempt in 1 2 3 4 5; do
            if ssh "$GCP_HOST" "echo SSH_READY_$attempt"; then
              connected=1
              break
            fi
            echo "SSH attempt $attempt failed, waiting 30s..."
            sleep 30
          done
          if [ "$connected" -eq 0 ]; then
            echo "All 5 SSH attempts failed — VM sshd not responding within ConnectTimeout"
            exit 1
          fi

      - name: Ensure swap is configured on GCP VM
        run: |
          ssh "$GCP_HOST" bash -s << 'SWAP'
          set -e
          if [ "$(swapon --show | wc -l)" -eq 0 ]; then
            echo "[SWAP] No swap active — creating 2 GB swapfile..."
            sudo fallocate -l 2G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            grep -q '/swapfile' /etc/fstab \
              || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab > /dev/null
            echo "[SWAP] Swap created and activated."
          else
            echo "[SWAP] Swap already active — skipping."
          fi
          cur=$(cat /proc/sys/vm/swappiness 2>/dev/null || echo 60)
          if [ "$cur" -ne 10 ]; then
            sudo sysctl -w vm.swappiness=10 > /dev/null
            grep -q 'vm.swappiness' /etc/sysctl.conf 2>/dev/null \
              || echo 'vm.swappiness=10' | sudo tee -a /etc/sysctl.conf > /dev/null
            echo "[SWAP] vm.swappiness set to 10."
          fi
          echo "[SWAP] Memory status:"
          free -h
          swapon --show
          SWAP

      - name: Compute app version
        id: app_version
        run: |
          VERSION=$(git log -1 --pretty=%s | grep -oP 'v\d{4}\.\d{2}\.\d{2}\.\d+' || true)
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_SHA:0:7}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Write ephemeral env file on GCP server
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TELEGRAM_CRITICAL_THREAD_ID: ${{ secrets.TELEGRAM_CRITICAL_THREAD_ID }}
          DOCKER_IMAGE: ${{ needs['docker-build-push'].outputs.image }}
          DOCKER_IMAGE_LATEST: ${{ needs['docker-build-push'].outputs.image_latest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          {
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n'     "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'TELEGRAM_BOT_TOKEN=%s\n'            "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_CHAT_ID=%s\n'              "$TELEGRAM_CHAT_ID"
            printf 'TELEGRAM_THREAD_ID=%s\n'            "$TELEGRAM_THREAD_ID"
            printf 'TELEGRAM_CRITICAL_THREAD_ID=%s\n'  "$TELEGRAM_CRITICAL_THREAD_ID"
            printf 'NEXT_PUBLIC_APP_VERSION=%s\n'       "${{ steps.app_version.outputs.value }}"
            printf 'DOCKER_IMAGE=%s\n'                  "$DOCKER_IMAGE"
            printf 'DOCKER_IMAGE_LATEST=%s\n'           "$DOCKER_IMAGE_LATEST"
            printf 'GHCR_TOKEN=%s\n'                    "$GHCR_TOKEN"
            printf 'GHCR_USERNAME=%s\n'                 "$GHCR_USERNAME"
          } | ssh "$GCP_HOST" 'umask 077 && cat > /tmp/.candyshop-build.env'

      - name: Copy deploy script to GCP server
        run: |
          cat scripts/deploy-production.sh | ssh "$GCP_HOST" \
            'cat > /tmp/deploy-production.sh && chmod +x /tmp/deploy-production.sh'

      - name: Start deployment
        env:
          DEPLOY_REPO_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          # Escape values before interpolating into the remote shell command.
          SAFE_REPO=$(printf '%q' "$DEPLOY_REPO_URL")
          SAFE_BRANCH=$(printf '%q' "$DEPLOY_BRANCH")
          ssh "$GCP_HOST" "
            rm -f /tmp/deploy-candyshop.done /tmp/deploy-candyshop.log
            REPO_URL=$SAFE_REPO \
            BRANCH=$SAFE_BRANCH \
            ENV_FILE='/tmp/.candyshop-build.env' \
            DEPLOY_DIR='/opt/candyshop' \
            DEPLOY_DETACHED=1 \
            nohup bash /tmp/deploy-production.sh > /tmp/deploy-candyshop.log 2>&1 &
            disown
          "
          echo "Deploy process started on GCP server — polling for result..."

      - name: Notify deploy started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import html, json, os, urllib.error, urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              print("Missing Telegram credentials — skipping notification")
              raise SystemExit(0)

          sha = os.environ.get("GITHUB_SHA", "")[:7]
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          text = (
              "🚀 <b>GCP Deploy Started</b>\n\n"
              f"Commit: <code>{html.escape(sha)}</code>\n"
              f"Triggered by: {html.escape(os.environ.get('GITHUB_ACTOR', ''))}\n\n"
              f"🔗 {html.escape(os.environ.get('RUN_URL', ''))}\n\n"
              f"\U0001F4CD github.com/{html.escape(repo)}"
          )

          payload = {"chat_id": chat_id, "text": text, "parse_mode": "HTML"}
          thread_id = os.environ.get("TELEGRAM_THREAD_ID", "").strip()
          if thread_id:
              try:
                  payload["message_thread_id"] = int(thread_id)
              except ValueError:
                  pass

          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Notification sent: {resp.status}")
          except Exception as e:
              print(f"Telegram notification failed (non-fatal): {e}")
          EOF

      - name: Wait for deployment
        run: |
          ssh_errors=0
          echo "Polling GCP deploy script every 20s (up to 15 min)..."
          for i in $(seq 1 45); do
            sleep 20
            elapsed=$(( i * 20 ))

            if RAW=$(ssh "$GCP_HOST" \
              'printf "DONE:%s\n" "$(cat /tmp/deploy-candyshop.done 2>/dev/null || echo pending)"
               echo "---LOG---"
               tail -5 /tmp/deploy-candyshop.log 2>/dev/null || echo "(no log yet)"
               echo "---END---"' \
              2>&1); then
              ssh_errors=0
            else
              ssh_errors=$((ssh_errors + 1))
              echo "[${elapsed}s] SSH error ($ssh_errors/5):"
              echo "$RAW"
              if [ "$ssh_errors" -ge 5 ]; then
                echo "5 consecutive SSH failures — aborting"
                exit 1
              fi
              continue
            fi

            RESULT=$(printf '%s' "$RAW" | grep '^DONE:' | sed 's/^DONE://')
            LOG=$(printf '%s' "$RAW" | awk '/^---LOG---/{f=1;next} /^---END---/{f=0} f{print}')

            echo "── [${elapsed}s | poll ${i}/45] ──────────────────────────"
            printf '%s\n' "${LOG:-(no output yet)}"

            if [ -n "$RESULT" ] && [ "$RESULT" != "pending" ]; then
              echo "──────────────────────────────────────────────────"
              echo "Deploy finished — exit code: $RESULT"
              [ "$RESULT" = "0" ] && exit 0 || exit 1
            fi
          done

          echo "Timed out after 15 min — dumping last 50 lines of deploy log:"
          ssh "$GCP_HOST" 'tail -50 /tmp/deploy-candyshop.log 2>/dev/null || true' || true
          exit 1

      - name: Verify deployment
        run: |
          # timeout 30: prevents hanging if ControlMaster expired and banner exchange stalls
          timeout 30 ssh "$GCP_HOST" \
            'docker ps --filter name=candyshop-prod --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>/dev/null || true' \
            || echo "Verify skipped (SSH timed out) — deploy confirmed by wait loop above"

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.PROD_CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.PROD_CF_ZONE_ID }}
        run: |
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -1)
          BODY=$(printf '%s' "$RESPONSE" | head -n -1)
          echo "Cloudflare response ($HTTP_CODE): $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Cloudflare purge failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Notify deploy complete
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import html, json, os, urllib.error, urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              print("Missing Telegram credentials — skipping notification")
              raise SystemExit(0)

          sha = os.environ.get("GITHUB_SHA", "")[:7]
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          text = (
              "✅ <b>GCP Deploy Complete</b>\n\n"
              f"Commit: <code>{html.escape(sha)}</code>\n"
              f"Triggered by: {html.escape(os.environ.get('GITHUB_ACTOR', ''))}\n"
              f"Cloudflare cache purged ✓\n\n"
              f"🔗 {html.escape(os.environ.get('RUN_URL', ''))}\n\n"
              f"\U0001F4CD github.com/{html.escape(repo)}"
          )

          payload = {"chat_id": chat_id, "text": text, "parse_mode": "HTML"}
          thread_id = os.environ.get("TELEGRAM_THREAD_ID", "").strip()
          if thread_id:
              try:
                  payload["message_thread_id"] = int(thread_id)
              except ValueError:
                  pass

          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Notification sent: {resp.status}")
          except Exception as e:
              print(f"Telegram notification failed (non-fatal): {e}")
          EOF

      - name: Cleanup
        if: always()
        run: |
          timeout 15 ssh "$GCP_HOST" \
            'rm -f /tmp/.candyshop-build.env /tmp/deploy-production.sh' 2>/dev/null || true
          rm -f ~/.ssh/gcp_deploy_key

  # ============================================
  # Alert Telegram when any job fails (standalone runs only).
  # When called from deploy-production.yml, that workflow's
  # notify-failure job already covers the failure alert.
  # ============================================
  notify-failure:
    name: Notify Deploy Failure
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [build, docker-build-push, deploy]
    if: ${{ always() && github.event_name != 'workflow_call' && (needs.build.result == 'failure' || needs['docker-build-push'].result == 'failure' || needs.deploy.result == 'failure') }}
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CRITICAL_THREAD_ID: ${{ secrets.TELEGRAM_CRITICAL_THREAD_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'EOF'
          import html, json, os, urllib.error, urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Missing required secret: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID")

          sha = os.environ["COMMIT_SHA"][:7]
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          text = (
              "🚨 <b>GCP Deploy Failed</b>\n\n"
              f"Commit: <code>{html.escape(sha)}</code>\n"
              f"Triggered by: {html.escape(os.environ['ACTOR'])}\n\n"
              f"🔗 {html.escape(os.environ['RUN_URL'])}\n\n"
              f"\U0001F4CD github.com/{html.escape(repo)}"
          )

          payload = {
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
          }
          thread_id = os.environ.get("TELEGRAM_CRITICAL_THREAD_ID", "").strip()
          if thread_id:
              try:
                  payload["message_thread_id"] = int(thread_id)
              except ValueError:
                  print(f"Warning: invalid TELEGRAM_CRITICAL_THREAD_ID={thread_id!r}, sending without thread")

          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Alert sent: {resp.read().decode('utf-8', errors='replace')}")
          except urllib.error.HTTPError as e:
              print(f"Telegram API error {e.code}: {e.read().decode('utf-8', errors='replace')}")
              raise
          except urllib.error.URLError as e:
              print(f"Network error reaching Telegram: {e.reason}")
              raise
          EOF

name: Sandbox Release (Promote to Staging)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Specific commit SHA to promote (leave empty for latest develop)"
        required: false
        default: ""

permissions: {}

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit_sha || 'develop' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # pnpm build -> scripts/build.mjs -> loadEnv('prod'), which under
          # CI=true resolves .env.prod's $secret: references straight from
          # this env: block. Names must match .env.prod's $secret: refs
          # exactly (see PROD_SUPABASE_ANON_KEY etc. below).
          NEXT_PUBLIC_ENABLE_MOCKS: "true"
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
          SUPABASE_AUTH_EXTERNAL_DISCORD_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_DISCORD_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_DISCORD_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_DISCORD_SECRET }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_DOMAIN: ${{ secrets.CLERK_DOMAIN }}
          TALLY_FORM_ID: ${{ secrets.TALLY_FORM_ID }}
          GOOGLE_TEST_EMAIL: ${{ secrets.GOOGLE_TEST_EMAIL }}
          GOOGLE_TEST_PASSWORD: ${{ secrets.GOOGLE_TEST_PASSWORD }}

  promote:
    needs: [quality-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine commit to promote
        id: resolve
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [ -n "$INPUT_COMMIT_SHA" ]; then
            COMMIT="$INPUT_COMMIT_SHA"
          else
            COMMIT=$(git rev-parse origin/develop)
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Promoting commit: $COMMIT"
          git log --oneline -1 "$COMMIT"

      - name: Update staging branch
        env:
          RESOLVED_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create staging branch if it doesn't exist
          if git rev-parse origin/staging >/dev/null 2>&1; then
            echo "Staging branch exists, updating..."
            git checkout staging
            git reset --hard "$RESOLVED_COMMIT"
          else
            echo "Creating staging branch..."
            git checkout -b staging "$RESOLVED_COMMIT"
          fi

          git push origin staging --force-with-lease

      - name: Summary
        env:
          RESOLVED_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          echo "## Sandbox Release Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${RESOLVED_COMMIT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Checks** | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The staging branch has been updated. The deploy workflow will automatically build and deploy the POC version." >> "$GITHUB_STEP_SUMMARY"

# Runs the production backup script every day at 4am UTC.
# Only uploads to Telegram when backup content has changed since the last upload.
# Manual trigger available via workflow_dispatch for on-demand runs.

name: Scheduled Backup (Production)

on:
  schedule:
    - cron: '0 4 * * *' # 4am UTC daily
  workflow_dispatch:

concurrency:
  group: backup-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Production Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore backup hash cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .backup-hash
          key: backup-hash-${{ github.run_id }}
          restore-keys: |
            backup-hash-

      - name: Create .secrets
        env:
          PROD_SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BACKUPS_THREAD_ID: ${{ secrets.TELEGRAM_BACKUPS_THREAD_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          {
            echo "PROD_SUPABASE_ACCESS_TOKEN=$PROD_SUPABASE_ACCESS_TOKEN"
            echo "PROD_SUPABASE_SERVICE_ROLE_KEY=$PROD_SUPABASE_SERVICE_ROLE_KEY"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
            echo "TELEGRAM_BACKUPS_THREAD_ID=$TELEGRAM_BACKUPS_THREAD_ID"
            echo "TELEGRAM_THREAD_ID=$TELEGRAM_THREAD_ID"
          } > .secrets

      - name: Run backup
        run: node scripts/backup-prod.mjs

      - name: Remove .secrets
        if: always()
        run: rm -f .secrets

      - name: Save backup hash cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .backup-hash
          key: backup-hash-${{ github.run_id }}

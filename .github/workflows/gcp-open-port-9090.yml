name: GCP Open Port 9090

on:
  workflow_dispatch:

jobs:
  open-port:
    name: Add GCP Firewall Rule for Port 9090
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH key
        run: |
          GCP_HOST=$(echo "${{ secrets.GCP_PROD_SERVER_HOST }}" | python3 -c "import sys; print(sys.stdin.buffer.read().decode('utf-8-sig').strip())")
          GCP_USER=$(echo "${{ secrets.GCP_PROD_SERVER_USER }}" | python3 -c "import sys; print(sys.stdin.buffer.read().decode('utf-8-sig').strip())")
          echo "GCP_HOST=$GCP_HOST" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_PROD_SERVER_SSH_KEY }}" | python3 -c "import sys; data=sys.stdin.buffer.read().decode('utf-8-sig'); sys.stdout.write(data.replace('\r',''))" > ~/.ssh/gcp_deploy_key
          chmod 600 ~/.ssh/gcp_deploy_key
          cat >> ~/.ssh/config << EOF
          Host $GCP_HOST
            HostName $GCP_HOST
            User $GCP_USER
            IdentityFile ~/.ssh/gcp_deploy_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
          EOF

      - name: Create firewall rule via VM gcloud
        run: |
          ssh $GCP_HOST "
            gcloud compute firewall-rules create allow-candyshop-9090 \
              --allow=tcp:9090 \
              --direction=INGRESS \
              --priority=1000 \
              --network=default \
              --description='Allow HTTP traffic on port 9090 for candyshop GCP VM' \
              --quiet 2>&1 || true
            echo '--- Current firewall rules for port 9090 ---'
            gcloud compute firewall-rules list --filter='name~9090 OR name~candyshop' --format='table(name,direction,allowed,targetTags,disabled)' 2>&1
          "

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/gcp_deploy_key
